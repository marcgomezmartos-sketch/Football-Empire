<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Empire</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial}*{box-sizing:border-box}body{margin:0;background:#080b0a;color:#f3f7f4;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(420px,100%);border:1px solid #27382e;background:#111714;border-radius:20px;padding:28px}h1{margin:0;color:#60f59a;letter-spacing:1px;font-size:26px}p{color:#a4b7a9}input,button{width:100%;padding:14px;border-radius:10px;font:inherit;margin-top:12px}input{background:#080d0a;border:1px solid #344739;color:white}button{border:0;background:#59ec90;color:#061109;font-weight:800;cursor:pointer}button.secondary{background:#25372c;color:white}button:disabled{opacity:.5}#message{min-height:24px;color:#ffd48b}#game{display:none}small{color:#9eb5a6}.hidden{display:none}</style></head><body><main class="panel"><h1>⚽ FOOTBALL EMPIRE</h1><p id="subtitle">Tu club. Tu historia. Tu legado.</p><section id="auth"><form id="form"><input id="email" type="email" placeholder="Correo electrónico" autocomplete="email" required><input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" autocomplete="current-password" required><button id="submit" type="submit">Iniciar sesión</button></form><button class="secondary" id="toggle">¿No tienes cuenta? Regístrate</button><p id="message" role="status"></p><small>Tu progreso se guarda en tu cuenta, no en este dispositivo.</small></section><section id="game"><p id="welcome"></p><h2 id="clubTitle">Crea tu club</h2><div id="clubForm"><input id="clubName" maxlength="32" placeholder="Nombre de tu club"><button id="createClub">Crear club</button></div><div id="career" class="hidden"><p id="stats"></p><button id="match">Jugar partido</button><p id="result" role="status"></p></div><button class="secondary" id="logout">Cerrar sesión</button></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
const $=id=>document.getElementById(id);let client,register=false,user=null,club=null;
function msg(t){$('message').textContent=t}function toggleGame(logged){$('auth').style.display=logged?'none':'block';$('game').style.display=logged?'block':'none'}
if(!SUPABASE_URL||!SUPABASE_ANON_KEY){msg('El administrador debe configurar Supabase en config.js antes de activar las cuentas.');$('submit').disabled=true;$('toggle').disabled=true}else{
client=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
client.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;toggleGame(!!user);if(user){$('welcome').textContent='Cuenta: '+user.email;loadClub()}else{club=null}});
}
$('toggle').onclick=()=>{register=!register;$('submit').textContent=register?'Crear cuenta':'Iniciar sesión';$('toggle').textContent=register?'¿Ya tienes cuenta? Inicia sesión':'¿No tienes cuenta? Regístrate';msg('')};
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg('Procesando…');const email=$('email').value.trim(),password=$('password').value;const {error,data}=register?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});$('submit').disabled=false;if(error){msg(error.message);return}msg(register&&!data.session?'Revisa tu correo para confirmar la cuenta.':'')};
async function loadClub(){const {data,error}=await client.from('clubs').select('*').eq('user_id',user.id).maybeSingle();if(error){$('clubTitle').textContent='Error cargando club';$('result').textContent=error.message;return}club=data;$('clubForm').classList.toggle('hidden',!!club);$('career').classList.toggle('hidden',!club);if(club)render()}
function render(){$('clubTitle').textContent=club.name;$('stats').textContent='7ª División · Dinero: '+club.money+' € · Fuerza: '+club.strength+' · Partidos: '+club.matches}
$('createClub').onclick=async()=>{if(!user)return;const name=$('clubName').value.trim();if(name.length<3)return alert('Escribe al menos 3 caracteres');const {error}=await client.from('clubs').insert({user_id:user.id,name});if(error)return alert(error.message);await loadClub()};
$('match').onclick=async()=>{if(!club)return;$('match').disabled=true;$('result').textContent='Jugando partido…';const {data,error}=await client.rpc('play_match');$('match').disabled=false;if(error){$('result').textContent=error.message;return}$('result').textContent=data?.message||'Partido terminado';await loadClub()};
$('logout').onclick=async()=>{if(client)await client.auth.signOut()};
</script></body></html>
