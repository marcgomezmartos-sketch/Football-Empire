<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Empire · Origen</title><style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#edf2ed;font:15px system-ui}main{max-width:960px;margin:auto;padding:18px}header,nav,.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}small{color:#b3bfb8}h1{font-size:32px;margin:8px 0}button,input,select{font:inherit;border:1px solid #53655e;border-radius:9px;padding:11px;background:#23342f;color:white}button{cursor:pointer}button.primary{background:#e5c477;color:#191c19;font-weight:800}button:disabled{opacity:.4}section{background:#1a2525;border:1px solid #344743;border-radius:16px;padding:16px;margin:12px 0}.stats>div{flex:1;min-width:95px;background:#24312e;padding:12px;border-radius:10px}.stats strong{display:block;font-size:23px;color:#e5c477}canvas{width:100%;display:block;border-radius:12px;touch-action:none}nav button{flex:1}a{color:#e5c477}.line{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #344743}.controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#log{color:#c6d6cb;min-height:44px}input{max-width:100%}.wide{width:100%;margin-top:12px}.versus{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:center;padding:24px 0}.versus>div{flex:1}.versus span{font-size:42px;color:#e5c477}.versus strong{font-size:32px;white-space:nowrap}.broadcast{text-align:center}.track{height:5px;background:#344743;margin:12px 0}.track>div{height:100%;background:#e5c477;transition:width .4s}.arena{height:110px;background:repeating-linear-gradient(90deg,#285e49 0 12.5%,#306951 12.5% 25%);border:2px solid #b7d5bd;position:relative;border-radius:8px}.center{position:absolute;left:50%;height:100%;border-left:2px solid #b7d5bd}.center:after{content:'';position:absolute;width:46px;height:46px;border:2px solid #b7d5bd;border-radius:50%;left:-25px;top:30px}#ball{position:absolute;left:50%;top:50%;width:12px;height:12px;background:white;border-radius:50%;transition:all .5s}.goal{color:#e5c477;animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}#feed{max-height:240px;overflow:auto;text-align:left;margin-top:16px}.last{text-align:center;border-top:1px solid #344743;padding-top:12px}nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}nav button{padding:10px 3px;font-size:13px}</style><main><header><div><small>FOOTBALL EMPIRE / ORIGEN 0.3</small><h1>ORIGEN</h1></div><a href="./index.html">Volver al menú</a></header><div id="app"></div></main><script>
const $=id=>document.getElementById(id), key='fe-origen-alpha-1', tiers=['Callejero','Amateur','Regional','Tercera','Segunda','Primera','Élite mundial'], levels=[32,48,64,78,89,96,99], requirements=[350,1400,4000,10000,22000,45000], places=[['Pista del barrio',110,290],['Tienda deportiva',410,110],['Entrenamiento',660,270],['Sede del club',410,380]];
let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}let tab='Partidos', pos={x:400,y:250}, target=null, match=null, raf=0;
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function start(){let names=Array.from({length:5},(_,i)=>$('p'+i).value.trim()||'Fundador '+(i+1));s={name:$('club').value.trim()||'Origen FC',names,ratings:[24,25,26,27,28],money:0,day:1,tier:0,wins:0,played:0,fans:0,facility:0,sponsor:false,tactic:'2-2',news:'Cinco amigos. Una pista. Todo por demostrar.'};save();render()}function needed(){return [7,10,13,16,19,22,25][s.tier]}function effective(){return Math.min(avg(),[38,53,68,81,91,97,99][s.tier])}function avg(){return Math.round(s.ratings.reduce((a,b)=>a+b,0)/5)}function note(t){s.news=t;save();render()}function go(t){if(match)return;tab=t;render()}function render(){cancelAnimationFrame(raf);if(!s){$('app').innerHTML='<section><h2>Cinco amigos. Un sueño.</h2><p>Funda tu equipo de fútbol sala.</p><input id="club" placeholder="Nombre del club">'+Array.from({length:5},(_,i)=>'<p><input id="p'+i+'" placeholder="Fundador '+(i+1)+'"></p>').join('')+'<button class="primary" onclick="start()">Comenzar historia</button></section>';return}
$('app').innerHTML='<div class="stats">'+[['Dinero',s.money+' €'],['Categoría',tiers[s.tier]],['Media',avg()],['Afición',s.fans],['Día',s.day]].map(a=>'<div><small>'+a[0]+'</small><strong>'+a[1]+'</strong></div>').join('')+'</div><section><h2>'+esc(s.name)+'</h2><nav>'+['Partidos','Plantilla','Club','Táctica'].map(t=>'<button onclick="go(\''+t+'\')">'+t+'</button>').join('')+'</nav></section><section id="panel"></section><section id="log">'+esc(s.news)+'</section>';let p=$('panel');
if(tab==='Partidos')p.innerHTML='<small>PRÓXIMO ENCUENTRO · '+tiers[s.tier].toUpperCase()+'</small><div class="versus"><div><span>◆</span><h3>'+esc(s.name)+'</h3><small>MEDIA '+avg()+'</small></div><b>VS</b><div><span>⬟</span><h3>'+esc(opponent())+'</h3><small>MEDIA '+levels[s.tier]+'</small></div></div><button class="primary wide" onclick="simulate()">▶ SIMULAR PARTIDO</button><p>Media competitiva: '+effective()+' · La categoría limita el rendimiento.</p><p>Victorias para ascender: '+s.wins+'/'+needed()+'</p>'+ (s.last?'<div class="last"><small>ÚLTIMO RESULTADO</small><h2>'+s.last.a+' — '+s.last.b+'</h2>'+esc(s.last.mvp)+'</div>':'');
if(tab==='Plantilla')p.innerHTML='<h2>Los cinco fundadores</h2>'+s.names.map((n,i)=>'<div class="line"><span>'+esc(n)+' · '+['POR','CIE','ALA','ALA','PIV'][i]+'</span><strong>'+s.ratings[i]+'</strong><button onclick="train('+i+')">Entrenar</button></div>').join('')+'<p><button onclick="train(-1)">Entrenar equipo</button></p>';
if(tab==='Club')p.innerHTML='<h2>Instalaciones</h2><p>Nivel '+s.facility+' · '+['Pista pública','Pabellón básico','Centro deportivo','Ciudad deportiva'][Math.min(3,s.facility)]+'</p><button onclick="build()">Mejorar · '+cost()+' €</button><h3>Patrocinio</h3><button onclick="sponsor()">'+(s.sponsor?'Contrato activo':'Negociar primer patrocinio')+'</button><h3>Ascenso</h3><p>'+ (s.tier===6?'Has alcanzado la élite.':needed()+' victorias, '+requirements[s.tier]+' € y nivel de instalaciones '+Math.min(3,s.tier+1))+'</p><button onclick="promote()">Solicitar ascenso</button>';
if(tab==='Táctica')p.innerHTML='<h2>Pizarra</h2><p>La formación influye en la simulación.</p>'+['2-2','1-2-1','3-1','4-0'].map(t=>'<button onclick="s.tactic=\''+t+'\';note(\'Formación actualizada\')">'+t+(s.tactic===t?' ✓':'')+'</button>').join('')+'<p>Actual: '+s.tactic+'</p>';
}
function cost(){return [100,500,1500][s.facility]||5000}function build(){if(s.facility>=3)return note('Instalaciones al máximo.');if(s.money<cost())return note('No tienes suficiente dinero.');s.money-=cost();s.facility++;note('Nuevas instalaciones inauguradas.')}function sponsor(){if(s.sponsor)return note('Ya tienes patrocinador.');if(s.played<2)return note('Disputa dos partidos para demostrar tu compromiso.');s.sponsor=true;s.money+=150;note('Primer patrocinio: 150 € y 25 € por victoria.')}function train(i){if(s.lastTraining===s.played)return note('Disputa otro partido antes de volver a entrenar.');s.lastTraining=s.played;s.day++;let cap=[38,53,68,81,91,97,99][s.tier];s.ratings=s.ratings.map((v,j)=>Math.max(v,Math.min(cap,v+(i===-1||i===j?1:0))));note('Sesión completada. El límite de desarrollo aumenta al ascender.')}function promote(){if(s.tier===6)return;if(s.wins<needed()||s.money<requirements[s.tier]||s.facility<Math.min(3,s.tier+1))return note('Todavía no cumples los requisitos de ascenso.');s.money-=requirements[s.tier];s.tier++;s.wins=0;note('¡ASCENSO! Bienvenidos a '+tiers[s.tier]+'.')}function finish(a,b){s.played++;s.day++;let win=a>b;s.wins+=win?1:0;s.money+=(win?75:15)*(s.tier+1)+(win&&s.sponsor?25:0);s.money=Math.max(0,s.money-[10,25,55,100,180,300,450][s.tier]);s.fans+=win?12*(s.tier+1):2;s.ratings=s.ratings.map(v=>Math.max(v,Math.min([38,53,68,81,91,97,99][s.tier],v+(win&&s.played%5===0?1:0))));match=null;note('Resultado '+a+'–'+b+' · '+(win?'¡Victoria!':a===b?'Empate':'Derrota'))}function opponent(){return s.played%3===0?'Atlético del Barrio':['Unión','Deportivo','Sporting'][s.played%3]+' '+tiers[s.tier]}
function simulate(){if(match)return;let rival=opponent(),a=0,b=0,shots=[0,0],goals=[],events=[],p=Math.max(.18,Math.min(.70,1/(1+Math.exp((levels[s.tier]+(s.played%5)*1.5-effective()-(s.tactic===['2-2','1-2-1','3-1','4-0'][s.played%4]?4:0))/9))));for(let i=0;i<12;i++){let side=Math.random()<p?0:1,goal=Math.random()<.34,minute=Math.floor((i+1)*40/13),idx=1+Math.floor(Math.random()*4),assist=1+(idx-1+1+Math.floor(Math.random()*3))%4;events.push({side,goal,minute,idx,assist})}match={};let panel=$('panel');panel.innerHTML='<div class="broadcast"><small>● EN DIRECTO · '+tiers[s.tier].toUpperCase()+'</small><div class="versus"><div>'+esc(s.name)+'</div><strong id="liveScore">0 : 0</strong><div>'+esc(rival)+'</div></div><div id="minute">00:00</div><div class="track"><div id="progress"></div></div><div class="arena"><div class="center"></div><div id="ball"></div></div><h2 id="headline">¡Comienza el partido!</h2><div id="detail">Los equipos saltan a la pista.</div><div id="feed"></div></div>';let i=0;function tick(){if(i===events.length){let counts=[0,0,0,0,0];goals.filter(e=>e.side===0).forEach(e=>counts[e.idx]++);let mvp=s.names[counts.indexOf(Math.max(...counts))];s.last={a,b,mvp:'MVP: '+mvp};$('headline').textContent=a>b?'¡VICTORIA!':a===b?'EMPATE':'DERROTA';$('minute').textContent='FINAL · 40:00';$('progress').style.width='100%';$('detail').textContent='Tiros: '+shots[0]+' – '+shots[1]+' · MVP del equipo: '+mvp;$('feed').insertAdjacentHTML('beforeend','<button class="primary wide" id="continue">Continuar</button>');$('continue').onclick=()=>finish(a,b);return}let e=events[i++];shots[e.side]++;let name=e.side?rival:s.names[e.idx],msg=e.goal?'¡GOOOL!':'Ocasión de '+name,detail=e.goal?(e.side?rival+' marca':name+' · Asistencia: '+s.names[e.assist]):'El disparo no encuentra portería';if(e.goal){goals.push(e);if(e.side)b++;else a++}$('liveScore').textContent=a+' : '+b;$('minute').textContent=e.minute+':00';$('progress').style.width=(e.minute/40*100)+'%';$('headline').textContent=msg;$('headline').className=e.goal?'goal':'';$('detail').textContent=detail;$('ball').style.left=(e.side?15:85)+'%';$('ball').style.top=(25+Math.random()*50)+'%';$('feed').insertAdjacentHTML('afterbegin','<div class="line"><small>'+e.minute+'′</small><span>'+esc(e.goal?'⚽ '+detail:msg)+'</span></div>');setTimeout(tick,e.goal?1250:550)}setTimeout(tick,700)}
render();
</script></html>
