<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Empire · Origen</title><style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#edf2ed;font:15px system-ui}main{max-width:960px;margin:auto;padding:18px}header,nav,.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}small{color:#b3bfb8}h1{font-size:32px;margin:8px 0}button,input,select{font:inherit;border:1px solid #53655e;border-radius:9px;padding:11px;background:#23342f;color:white}button{cursor:pointer}button.primary{background:#e5c477;color:#191c19;font-weight:800}button:disabled{opacity:.4}section{background:#1a2525;border:1px solid #344743;border-radius:16px;padding:16px;margin:12px 0}.stats>div{flex:1;min-width:95px;background:#24312e;padding:12px;border-radius:10px}.stats strong{display:block;font-size:23px;color:#e5c477}canvas{width:100%;display:block;border-radius:12px;touch-action:none}nav button{flex:1}a{color:#e5c477}.line{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #344743}.controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#log{color:#c6d6cb;min-height:44px}input{max-width:100%}</style><main><header><div><small>FOOTBALL EMPIRE / NUEVO MODO</small><h1>ORIGEN</h1></div><a href="./index.html">Volver al menú</a></header><div id="app"></div></main><script>
const $=id=>document.getElementById(id), key='fe-origen-alpha-1', tiers=['Callejero','Amateur','Regional','Tercera','Segunda','Primera','Élite mundial'], levels=[28,44,58,72,82,91,97], requirements=[150,600,1800,4500,10000,22000], places=[['Pista del barrio',110,290],['Tienda deportiva',410,110],['Entrenamiento',660,270],['Sede del club',410,380]];
let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}let tab='Ciudad', pos={x:400,y:250}, target=null, match=null, raf=0;
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function start(){let names=Array.from({length:5},(_,i)=>$('p'+i).value.trim()||'Fundador '+(i+1));s={name:$('club').value.trim()||'Origen FC',names,ratings:[24,25,26,27,28],money:0,day:1,tier:0,wins:0,played:0,fans:0,facility:0,sponsor:false,tactic:'2-2',news:'Cinco amigos. Una pista. Todo por demostrar.'};save();render()}function avg(){return Math.round(s.ratings.reduce((a,b)=>a+b,0)/5)}function note(t){s.news=t;save();render()}function go(t){tab=t;match=null;render()}function render(){cancelAnimationFrame(raf);if(!s){$('app').innerHTML='<section><h2>Cinco amigos. Un sueño.</h2><p>Funda tu equipo de fútbol sala.</p><input id="club" placeholder="Nombre del club">'+Array.from({length:5},(_,i)=>'<p><input id="p'+i+'" placeholder="Fundador '+(i+1)+'"></p>').join('')+'<button class="primary" onclick="start()">Comenzar historia</button></section>';return}
$('app').innerHTML='<div class="stats">'+[['Dinero',s.money+' €'],['Categoría',tiers[s.tier]],['Media',avg()],['Afición',s.fans],['Día',s.day]].map(a=>'<div><small>'+a[0]+'</small><strong>'+a[1]+'</strong></div>').join('')+'</div><section><h2>'+esc(s.name)+'</h2><nav>'+['Ciudad','Partidos','Plantilla','Club','Táctica'].map(t=>'<button onclick="go(\''+t+'\')">'+t+'</button>').join('')+'</nav></section><section id="panel"></section><section id="log">'+esc(s.news)+'</section>';let p=$('panel');
if(tab==='Ciudad'){p.innerHTML='<h2>Distrito de origen</h2><small>Toca el mapa para caminar o utiliza el viaje rápido.</small><canvas id="map" width="800" height="460"></canvas><div class="controls">'+places.map((a,i)=>'<button onclick="visit('+i+')">'+a[0]+'</button>').join('')+'</div>';let c=$('map');c.onclick=e=>{let r=c.getBoundingClientRect();target={x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*460/r.height}};cityLoop()}
if(tab==='Partidos')p.innerHTML='<h2>Jornada '+(s.played+1)+'</h2><p>'+esc(s.name)+' vs '+(s.played%3===0?'Atlético del Barrio':'Unión '+tiers[s.tier])+' · Media rival '+levels[s.tier]+'</p><button class="primary" onclick="simulate()">Simular encuentro</button> <button onclick="play(false)">Jugar equipo</button> <button onclick="play(true)">Jugar fundador</button><p>Victorias en categoría: '+s.wins+'/5</p>';
if(tab==='Plantilla')p.innerHTML='<h2>Los cinco fundadores</h2>'+s.names.map((n,i)=>'<div class="line"><span>'+esc(n)+' · '+['POR','CIE','ALA','ALA','PIV'][i]+'</span><strong>'+s.ratings[i]+'</strong><button onclick="train('+i+')">Entrenar</button></div>').join('')+'<p><button onclick="train(-1)">Entrenar equipo</button></p>';
if(tab==='Club')p.innerHTML='<h2>Instalaciones</h2><p>Nivel '+s.facility+' · '+['Pista pública','Pabellón básico','Centro deportivo','Ciudad deportiva'][Math.min(3,s.facility)]+'</p><button onclick="build()">Mejorar · '+cost()+' €</button><h3>Patrocinio</h3><button onclick="sponsor()">'+(s.sponsor?'Contrato activo':'Negociar primer patrocinio')+'</button><h3>Ascenso</h3><p>'+ (s.tier===6?'Has alcanzado la élite.':'5 victorias, '+requirements[s.tier]+' € y nivel de instalaciones '+Math.min(3,s.tier+1))+'</p><button onclick="promote()">Solicitar ascenso</button>';
if(tab==='Táctica')p.innerHTML='<h2>Pizarra</h2><p>La formación influye en la simulación.</p>'+['2-2','1-2-1','3-1','4-0'].map(t=>'<button onclick="s.tactic=\''+t+'\';note(\'Formación actualizada\')">'+t+(s.tactic===t?' ✓':'')+'</button>').join('')+'<p>Actual: '+s.tactic+'</p>';
}
function visit(i){pos={x:places[i][1],y:places[i][2]};target=null;go(['Partidos','Club','Plantilla','Club'][i])}
function cityLoop(){let c=$('map');if(!c)return;let g=c.getContext('2d');if(target){let dx=target.x-pos.x,dy=target.y-pos.y,d=Math.hypot(dx,dy);if(d>3){pos.x+=dx/d*3;pos.y+=dy/d*3}else target=null}g.fillStyle='#788c72';g.fillRect(0,0,800,460);g.fillStyle='#465453';g.fillRect(0,195,800,65);g.fillRect(350,0,90,460);g.strokeStyle='#d9d5ae';g.setLineDash([14,12]);g.beginPath();g.moveTo(0,228);g.lineTo(800,228);g.stroke();g.setLineDash([]);for(let i=0;i<8;i++){let x=20+i*96,y= i%2?45:65;if(x>310&&x<450)continue;g.fillStyle='#3c4a42';g.fillRect(x+9,y+12,70,90);g.fillStyle='#c5ad8a';g.fillRect(x,y,70,90);g.fillStyle='#a16f57';g.fillRect(x-4,y-10,78,25);g.fillStyle='#48636c';for(let j=0;j<3;j++)g.fillRect(x+8+j*20,y+28,12,20)}g.fillStyle='#467b70';g.fillRect(25,275,230,155);g.strokeStyle='#e7e8d5';g.strokeRect(35,285,210,135);g.beginPath();g.arc(140,352,25,0,7);g.stroke();g.beginPath();g.moveTo(140,285);g.lineTo(140,420);g.stroke();for(let i=0;i<7;i++){let x=470+i*45,y=385;g.fillStyle='#435c3c';g.beginPath();g.arc(x,y,19,0,7);g.fill()}for(let a of places){g.fillStyle='#152721';g.fillRect(a[1]-64,a[2]-23,128,24);g.fillStyle='#fff';g.font='12px system-ui';g.textAlign='center';g.fillText(a[0],a[1],a[2]-7)}g.fillStyle='#0005';g.beginPath();g.ellipse(pos.x,pos.y+7,12,5,0,0,7);g.fill();g.fillStyle='#e5c477';g.fillRect(pos.x-7,pos.y-14,14,20);g.fillStyle='#c78d66';g.beginPath();g.arc(pos.x,pos.y-20,7,0,7);g.fill();raf=requestAnimationFrame(cityLoop)}
function cost(){return [100,500,1500][s.facility]||5000}function build(){if(s.facility>=3)return note('Instalaciones al máximo.');if(s.money<cost())return note('No tienes suficiente dinero.');s.money-=cost();s.facility++;note('Nuevas instalaciones inauguradas.')}function sponsor(){if(s.sponsor)return note('Ya tienes patrocinador.');if(s.played<2)return note('Disputa dos partidos para demostrar tu compromiso.');s.sponsor=true;s.money+=150;note('Primer patrocinio: 150 € y 25 € por victoria.')}function train(i){s.day++;s.ratings=s.ratings.map((v,j)=>Math.min(99,v+(i===-1||i===j?1+s.facility:0)));note('Sesión completada. Los fundadores mejoran.')}function promote(){if(s.tier===6)return;if(s.wins<5||s.money<requirements[s.tier]||s.facility<Math.min(3,s.tier+1))return note('Todavía no cumples los requisitos de ascenso.');s.money-=requirements[s.tier];s.tier++;s.wins=0;note('¡ASCENSO! Bienvenidos a '+tiers[s.tier]+'.')}function finish(a,b){s.played++;s.day++;let win=a>b;s.wins+=win?1:0;s.money+=(win?75:15)*(s.tier+1)+(win&&s.sponsor?25:0);s.fans+=win?12*(s.tier+1):2;s.ratings=s.ratings.map(v=>Math.min(99,v+(win?1:0)));match=null;note('Resultado '+a+'–'+b+' · '+(win?'¡Victoria!':a===b?'Empate':'Derrota'))}function simulate(){let a=0,b=0,p=1/(1+Math.exp((levels[s.tier]-avg()-(s.tactic==='1-2-1'?2:0))/7));for(let i=0;i<8;i++){if(Math.random()<.45){if(Math.random()<p)a++;else b++}}finish(a,b)}
function play(solo){let p=$('panel');p.innerHTML='<h2 id="score">0 – 0</h2><canvas id="pitch" width="800" height="440"></canvas><p>Toca la pista para mover al jugador. Pulsa tirar cerca del balón.</p><button onclick="shoot()">Tirar</button> <button onclick="switcher()">Cambiar jugador</button> <button onclick="go(\'Partidos\')">Abandonar</button>';match={solo,a:0,b:0,t:45,players:[{x:65,y:220},{x:220,y:120},{x:220,y:320},{x:390,y:120},{x:390,y:320}],rivals:[{x:735,y:220},{x:590,y:100},{x:590,y:340},{x:470,y:140},{x:470,y:300}],sel:solo?3:4,ball:{x:400,y:220,vx:0,vy:0},dest:null,last:performance.now(),cool:0};$('pitch').onclick=e=>{let r=e.target.getBoundingClientRect();if(match)match.dest={x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*440/r.height}};gameLoop()}function switcher(){if(match&&!match.solo){match.sel=(match.sel+1)%5;match.dest=null}}function shoot(){if(!match)return;let m=match,p=m.players[m.sel],b=m.ball;if(Math.hypot(p.x-b.x,p.y-b.y)<32){b.vx=9;b.vy=(220-b.y)/40;m.cool=20}}function gameLoop(){let m=match,c=$('pitch');if(!m||!c)return;let now=performance.now();m.t-=(now-m.last)/1000;m.last=now;if(m.t<=0){finish(m.a,m.b);return}let g=c.getContext('2d'),b=m.ball,p=m.players[m.sel];function move(p,t,v){let dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy);if(d>v){p.x+=dx/d*v;p.y+=dy/d*v}}if(m.dest)move(p,m.dest,2.4);let near=m.rivals.slice(1).sort((a,b2)=>Math.hypot(a.x-b.x,a.y-b.y)-Math.hypot(b2.x-b.x,b2.y-b.y))[0];move(near,b,1.1+levels[s.tier]/65);if(m.cool>0)m.cool--;if(Math.hypot(near.x-b.x,near.y-b.y)<17&&!m.cool){b.vx=-5-levels[s.tier]/20;b.vy=(220-b.y)/50;m.cool=30}if(Math.hypot(p.x-b.x,p.y-b.y)<20&&!m.cool&&m.dest){b.vx=(m.dest.x-p.x)*.07;b.vy=(m.dest.y-p.y)*.07}b.x+=b.vx;b.y+=b.vy;b.vx*=.985;b.vy*=.985;if(b.y<20||b.y>420){b.vy*=-1;b.y=Math.max(20,Math.min(420,b.y))}if(b.x<15||b.x>785){if(Math.abs(b.y-220)<65){if(b.x>785)m.a++;else m.b++;Object.assign(b,{x:400,y:220,vx:0,vy:0})}else{b.vx*=-1;b.x=Math.max(15,Math.min(785,b.x))}}g.fillStyle='#37786d';g.fillRect(0,0,800,440);g.strokeStyle='#f3f1dd';g.lineWidth=3;g.strokeRect(15,15,770,410);g.beginPath();g.moveTo(400,15);g.lineTo(400,425);g.stroke();g.beginPath();g.arc(400,220,55,0,7);g.stroke();g.strokeRect(15,155,85,130);g.strokeRect(700,155,85,130);for(let [arr,color] of [[m.players,'#e8c677'],[m.rivals,'#b44b52']])arr.forEach((q,i)=>{g.fillStyle=color;g.beginPath();g.arc(q.x,q.y,13,0,7);g.fill();if(q===p){g.strokeStyle='white';g.stroke()}g.fillStyle='#17221e';g.font='12px system-ui';g.textAlign='center';g.fillText(i+1,q.x,q.y+4)});g.fillStyle='white';g.beginPath();g.arc(b.x,b.y,7,0,7);g.fill();$('score').textContent=m.a+' – '+m.b+' · '+Math.ceil(m.t)+' s';raf=requestAnimationFrame(gameLoop)}render();
</script></html>
